    <script type="text/javascript">
        var id_user = "VMGv";
        var nama_user = "Ichsan Store";

        // tampilkan loader
        $("#loader1").removeClass("d-none");

        // Riwayat Kosong
        const produkNone = `
        <div class="text-center animate__animated animate__fadeIn">
        <img src="https://uki.my.id/assets/images/produk-none.webp" class="w-100 borad-5 shadow-sm">
        <p class="mt-3 f-16 fwb-6 op-7">Sepertinya belum ada transaksi nih. Yukk order...</p>
        </div>
        `

        let dataRiwayat = null

        // Loop Riwayat
        function loopRiwayat() {

            $("#dataRiwayat").html(`<div class="animate__animated animate__fadeIn" id="isiRiwayat"></div>`)

            // tampilkan loader loadz sambil menunggu data produk
            $("#isiRiwayat").append(`
                <div class="laoderRiwayat">
                    <div class="intern"></div>
                    <div class="external-shadow">
                        <div class="central"></div>
                    </div>
                </div>
            `)

            // FETCH DATA layanan
            fetch(baseUrl + 'koneksi=get_order_member&id_user=' + id_user)
                .then(response => response.json())
                .then(data => {
                    console.log(data);

                    // cek apakah data kosong atau tidak
                    if (data.length == 0) {
                        $("#isiRiwayat").html(produkNone)
                    } else {
                        dataRiwayat = data

                        $("#isiRiwayat").html("")

                        let box, margin
                        if (dataTampilan == 0) {
                            box = "box-list"
                            margin = "me-3"
                        } else {
                            box = "box-grid"
                            margin = "mb-3"
                        }

                        let block
                        if (dataGambar == 0) {
                            block = ""
                        } else {
                            block = "d-none"
                        }

                        // Looping data produk
                        for (let i = 0; i < dataRiwayat.length; i++) {
                            let v = dataRiwayat[i]
                            let harga = formatRupiah(v.harga)
                            let id_produk = v.id_riwayat
                            let nama_produk = v.produk
                            let status = v.status_pesanan

                            $("#isiRiwayat").append(`
                                <div class="mb-2 bg-produk animate__animated animate__flipInX" id="bg-prod-${i}" onclick="nextDetail('${i}')" data-bs-toggle="offcanvas" data-bs-target="#detailCanv" aria-controls="detailCanv">
                                    <div class="d-flex justify-content-end mb-2">
                                        <div style="font-size:10px" class="card d-flex justify-content-center align-items-center flex-row p-2">
                                            <i class="fas fa-calendar-alt op-7 me-1"></i>
                                            <p class="op-7 mb-0">${v.tanggal_pesanan}</p>
                                        </div>
                                    </div>
                                    <div class="box-utama ${box}">
                                        <div class="text-start">
                                            <p class="fwb-6 f-14">${nama_produk}</p>
                                            <p class="fwb-6 op-7 f-12">${status}</p>
                                            <p class="fwb-6 f-14 u-color format-rupiah">${harga}</p>
                                        </div>
                                    </div>
                                </div>

                            `)
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });

            // sembuyikan loader
            $("#loader1").addClass("d-none");

        }


        // Next Detail
        function nextDetail(i) {
            var v = dataRiwayat[i];
            console.log(v);
            let harga = formatRupiah(v.harga)
            let order_id = v.id_riwayat
            let nama_produk = v.produk
            let status = v.status_pesanan
            let sn = v.sn
            let form_otp = v.form_otp

            $("#bodyCanv").html(`
                        <div class="text-center">
                            <div class="mt-3">
                                <p class="fwb-6">${nama_produk}</p>
                                <p class="fwb-6 f-14 u-color mt-1">${harga}</p>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between py-2" style="border-bottom: dotted #ededed;">
                            <p class="fwb-6 f-14 op-7">USER:</p>
                            <p class="fwb-6 f-14 text-right" id="statusOrderan">${v.buyer}</p>
                        </div>
                        <div class="d-flex justify-content-between py-2" style="border-bottom: dotted #ededed;">
                            <p class="fwb-6 f-14 op-7">STATUS:</p>
                            <p class="fwb-6 f-14 text-right" id="statusOrderan">${status}</p>
                        </div>
                        <div class="d-flex justify-content-between py-2" style="border-bottom: dotted #ededed;">
                            <p class="fwb-6 f-14 op-7">TANGGAL ORDER:</p>
                            <p class="fwb-6 f-14 text-right" id="statusOrderan">${v.tanggal_pesanan}</p>
                        </div>
                        <div class="p-3 mt-3 mb-2 borad-5" style="background-color: #f6f8ff; border: 2px dotted #2196F3;">
                            <p class="fwb-6 f-14 op-7">SERIAL ORDER :</p>
                            <p class="fwb-6 f-14">${sn}</p>
                        </div>
                        <div class="py-2" style="border-bottom: dotted #ededed;">
                            <p class="fwb-6 f-14 op-7">TOTAL HARGA</p>
                            <p class="fwb-6 f-14" id="totalHarga">${harga}</p>
                        </div>
                        <div class="mt-3">
                            <div class="d-flex align-items-center">
                                <div class="w-100 u-bg p-2 borad-5"
                                    onclick="komplain(${i})">
                                    <p class="f-14 text-center text-white">Komplain</p>
                                </div>
                            </div>
                        </div> 
                        ${form_otp == 1 ? `
                            <div class="mt-3">
                                <div class="d-flex align-items-center">
                                    <div class="w-100 u-bg p-2 borad-5"
                                        onclick="cekOtp(${i})">
                                        <p class="f-14 text-center text-white">Cek OTP</p>
                                    </div>
                                </div>
                            </div>
                        ` : ``}
                        
                    `);
        }

        // fungsi komplain dengan modal offcanvas
        function komplain(index) {
            var v = dataRiwayat[index];

            $("#bodyCanv").html(`
                <h6 class="mb-3 text-center">FORM GARANSI APLIKASI PREMIUM</h6>

                <input type="hidden" id="k_order_id" value="${v.id_riwayat}">
                <input type="hidden" id="k_produk" value="${v.produk}">
                <input type="hidden" id="k_id_produk" value="${v.id_produk}">
                <input type="hidden" id="k_sn" value="${v.sn}">
                <input type="hidden" id="k_tgl_order" value="${v.tanggal_pesanan}">
                <input type="hidden" id="k_buyer" value="${v.buyer}">
                <input type="hidden" id="k_id_user" value="${v.id_user}">


                <div class="mb-2">
                    <label class="f-14">Kendala</label>
                    <textarea id="k_kendala" class="form-control" rows="3"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-secondary w-50" onclick="nextDetail(${index})">Kembali</button>
                    <button class="btn btn-primary w-50" onclick="kirimKomplain()">Kirim</button>
                </div>
            `);

            var myOffcanvas = new bootstrap.Offcanvas(document.getElementById('detailCanv'));
            myOffcanvas.show();
        }

        function kirimKomplain() {

            let today = new Date();
            let tgl_report = today.getFullYear() + "-" +
                String(today.getMonth() + 1).padStart(2, '0') + "-" +
                String(today.getDate()).padStart(2, '0');

            let pesan = `FORM GARANSI APLIKASI PREMIUM

Nama akun preflix : ${$("#k_buyer").val()}
Id akun preflix : ${$("#k_id_user").val()}
Nama apprem : ${$("#k_produk").val()}
Id apprem : ${$("#k_id_produk").val()}
Durasi : 1
Tgl order : ${$("#k_tgl_order").val()}
Tgl report : ${tgl_report}
Serial order: ${$("#k_sn").val()}
Kendala : ${$("#k_kendala").val()}

ESTIMASI GARANSI 3x24 jam, maksimal 7x24jam.`;

            let url = "https://t.me/minlix_ai_bot?text=" + encodeURIComponent(pesan);

            window.open(url, "_blank");
        }


        // fungsi cek OTP
        function cekOtp(index) {
            let id_riwayat = dataRiwayat[index].id_riwayat;

            // // tambahkan id_riwayat ke local storage
            // localStorage.setItem('id_riwayat', id_riwayat);
            // console.log("id_riwayat disimpan di localStorage:", id_riwayat);

            location.replace(
                "https://preflix.my.id/otp.html"
                + "#id_riwayat=" + id_riwayat
                + "&id_user=" + id_user
                + "&nama_user=" + nama_user
            );


        }

        // Default Data
        function defaultData() {
            dataTampilan = 0
            dataGambar = 0
            dataPencarian = 0

            urutanRiwayat = "Termurah"

            $(".dropdown-item").removeClass("u-color")
            $("#pil-" + urutanRiwayat).addClass("u-color")
            $("#namaPil").html(urutanRiwayat)

            $("#search").val("")
            $("#flush-collapseOne").removeClass("show")

        }


        function formatRupiah(angka) {
            var formatter = new Intl.NumberFormat("id-ID", {
                style: "currency",
                currency: "IDR",
                minimumFractionDigits: 0,
            });

            return formatter.format(angka).replace(/IDR/g, "Rp ");
        }

        //------------- START SISTEM -------------//

        defaultData()
        $(document).ready(function () {
            // loopCat()
            loopRiwayat()
        })



        // --- HISTORY API LOGIC ---
        $('.offcanvas').on('show.bs.offcanvas', function () {
            isBackButtonPressed = false;
            window.history.pushState({ offcanvas: true }, "");
        });

        $('.offcanvas').on('hide.bs.offcanvas', function (e) {
            if (!isBackButtonPressed) {
                window.history.back();
            }
            isBackButtonPressed = false;
        });

        window.addEventListener('popstate', function (event) {
            isBackButtonPressed = true;
            var offcanvasList = document.querySelectorAll('.offcanvas.show');
            if (offcanvasList.length > 0) {
                offcanvasList.forEach(function (el) {
                    var bsOffcanvas = bootstrap.Offcanvas.getInstance(el);
                    if (bsOffcanvas) {
                        bsOffcanvas.hide();
                    }
                });
            }
        });
        //------------- END SISTEM -------------//

    </script>

    <script>
        // Menangkap error biasa (syntax / runtime)
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            alert(
                "JS ERROR:\n" +
                "Pesan: " + msg + "\n" +
                "File: " + url + "\n" +
                "Line: " + lineNo + "\n" +
                "Col: " + columnNo + "\n" +
                "Detail: " + (error && error.stack ? error.stack : error)
            );
            return false;
        };

        // Menangkap error promise (async/await, fetch, dll)
        window.addEventListener("unhandledrejection", function (event) {
            alert(
                "ASYNC ERROR:\n" +
                event.reason
            );
        });

        function debug(data) {
            alert(JSON.stringify(data, null, 2));
        }
    </script>
